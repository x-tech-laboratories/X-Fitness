name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npm test
      - run: npm run lint
  npm-deps-hash:
    uses: x-tech-laboratories/X-Libs/.github/workflows/npm-deps-hash.yml@worktree-npm-hash-workflow
    permissions:
      contents: write
